<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momento Doce | Encomenda</title>
    <meta name="author" content="Jainilene Nascimento">
    <meta name="description" content="Página para cliente realizar encomenda de pedido na loja Momento Doce">
    <link rel="stylesheet" href="estilos/projeto.css">
    <link rel="stylesheet" href="estilos/projeto-grande.css">
    <script src="scripts/projeto.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Delius&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Lavishly+Yours&family=Petit+Formal+Script&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <p>Momento Doce</p>
        <button id="menu"></button>
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="precos.html">Preços</a></li>
                <li><a href="encomenda.html">Encomenda</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form id="form-encomenda" action="encomenda-realizada.html">

            <h2>Faça sua encomenda</h2>

            <fieldset>
                <legend>Dados do cliente</legend>

                <label for="nome">Nome:<span class="obrigatorio">*</span></label>
                <input type="text" id="nome" name="nome" required>

                <label for="telefone">Telefone:<span class="obrigatorio">*</span></label>
                <input type="tel" id="telefone" name="telefone" required>
            </fieldset>

            <fieldset>
                <legend>Escolha seu doce</legend>

                <label for="produto">Produto:<span class="obrigatorio">*</span></label>

                <select id="produto" name="produto" required>
                    <option value="">Selecione um produto</option>
                </select>

                <p id="descricao-produto"></p>

                <label for="quantidade">Quantidade:<span class="obrigatorio">*</span></label>

                <input type="number" id="quantidade" name="quantidade" min="1" value="1" required>

                <div class="div-botao-acrescentar" id="add_doce">
                    <button type="button">
                        Acrescentar doce
                    </button>
                </div>

            </fieldset>

            <fieldset>
                <legend>Forma de pagamento<span class="obrigatorio">*</span></legend>

                <label>
                    <input type="radio" name="pagamento" value="Pix" required>
                    Pix
                </label>

                <label>
                    <input type="radio" name="pagamento" value="Cartão">
                    Cartão
                </label>

                <label>
                    <input type="radio" name="pagamento" value="Dinheiro">
                    Dinheiro
                </label>
            </fieldset>

            <fieldset>
                <legend>Observações</legend>

                <textarea id="observacoes" name="observacoes" rows="4"
                    placeholder="Ex.: escrever nome no bolo..."></textarea>
            </fieldset>

            <fieldset id="resultado">
                <h2>Resumo da encomenda</h2>
                <ul id="list"></ul>

                <div id="resumo"></div>
            </fieldset>

            <div class="div-botao-enviar">
                <button type="submit">
                    Finalizar encomenda
                </button>
            </div>
        </form>



    </main>

    <footer>
        <p>&copy;<span id="anoatual"></span> - Momento Doce - Maranhão</p>
        <p>Última modificação: <span id="ultima-mdificacao"></span> </p>
    </footer>
</body>

</html>

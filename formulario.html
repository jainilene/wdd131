<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="estilos/formulario.css">
    <link rel="stylesheet" href="estilos/formulario-grande.css">
    <script src="scripts/formulario.js" defer></script>
    <meta name="author" content="Jainilene Nascimento">
    <meta name="description" content="Página para cliente realizar avaliação do produto adquirido">
</head>

<body>

    <header>
        <h1>Avaliação do Produto</h1>
    </header>

    <main>

        <form method="get" action="avaliacao.html">
            <label class="label-nome-produto">Nome do Produto<spam class="obrigatorio">*</spam>
                <select id="nome-produto" name="nome-produto" required>
                    <option value="nome-produto" disabled selected>Selecione um produto</option>
                </select>
            </label>

            <label>Classificação Geral<spam class="obrigatorio">*</spam></label>
            <div class="class-estrela">
                <div class="estrela">
                    <input type="radio" name="classificação" id="classificação1" value="1" required>
                    <label for="classificação1">
                        ☆
                    </label>
                </div>
                <div class="estrela">
                    <label for="classificação">
                        <input type="radio" name="classificação" id="classificação2" value="2" required>
                        ☆ ☆
                    </label>
                </div>
                <div class="estrela">
                    <label for="classificação">
                        <input type="radio" name="classificação" id="classificação3" value="3" required>
                        ☆ ☆ ☆
                    </label>
                </div>
                <div class="estrela">
                    <label for="classificação">
                        <input type="radio" name="classificação" id="classificação4" value="4" required>
                        ☆ ☆ ☆ ☆
                    </label>
                </div>
                <div class="estrela">
                    <label for="classificação">
                        <input type="radio" name="classificação" id="classificação5" value="5" required>
                        ☆ ☆ ☆ ☆ ☆
                    </label>
                </div>
            </div>
            <label>Data de Instalação <spam class="obrigatorio">*</spam><input type="date" id="data-instalacao"
                    name="data-instalacao" required></label>

            <label>Quais recursos você achou úteis no produto? (Marque todos que se aplicam) </label>
            <label class="label-recursos">
                <input type="checkbox" name="desempenho" id="desempenho" value="desempenho">
                Desempenho
            </label>
            <label class="label-recursos">
                <input type="checkbox" name="design" id="design" value="design">
                Design
            </label>
            <label class="label-recursos">
                <input type="checkbox" name="durabilidade" id="durabilidade" value="durabilidade">
                Durabilidade
            </label>
            <label class="label-recursos">
                <input type="checkbox" name="facilidade" id="facilidade" value="facilidade">
                Facilidade de Uso
            </label>

            <label>Avaliação Escrita<span class="opcional">(Opcional)</span>
                <textarea name="avaliacao-escrita" id="avaliacao-escrita"></textarea>
            </label>

            <label>Seu Nome<span class="opcional">(Opcional)</span>
                <input type="text" name="nome-usuario" id="nome-usuario">
            </label>

            <div class="botao-publicar">
                <input type="submit" value="Publicar Avaliação">
            </div>

        </form>
    </main>

    <footer>
        <p>&copy;<span id="anoatual"></span> - Jainilene Nascimento - Maranhão</p>
        <p>Última modificação: <span id="ultima-mdificacao"></span> </p>
    </footer>

</body>

</html>
